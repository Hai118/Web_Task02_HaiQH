<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between bg-light">

  <div class="container my-auto py-5">
    <div class="text-center mb-4">
      <div class="brand-icon">M</div>
      <h2 class="fw-bold">Welcome Back!</h2>
      <p class="text-muted small">Sign in to continue to your account.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card p-4 login-card bg-white">
          <h4 class="fw-bold mb-1">Login to your account</h4>
          <p class="text-muted small mb-4">Enter your email and password to get started.</p>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label small fw-bold mb-1">Email Address</label>
              <input type="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-bold mb-0">Password</label>
                <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
              </div>
              <div class="input-group">
                <input type="password" id="passwordInput" class="form-control" placeholder="Enter your password" required>
                <button class="btn btn-outline-secondary btn-sm" type="button" id="toggleBtn">show</button>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2">Sign In</button>
          </form>

          <p class="text-center small text-muted mt-4 mb-0">
            Don't have an account? <a href="#" class="text-primary text-decoration-none">Create an account</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-3">
    <div class="container">
      <p class="small mb-0">&copy; 2026 My Website. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const passwordInput = document.getElementById('passwordInput');
    const toggleBtn = document.getElementById('toggleBtn');

    toggleBtn.addEventListener('click', function() {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = 'hide';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = 'show';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Login successful!');
      window.location.href = 'home.html';
    });
  </script>
</body>
</html>
